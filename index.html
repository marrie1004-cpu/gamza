<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>감자 마켓 (Gamza) - 포근한 우리 동네 중고거래</title>
  <!-- Pretendard 웹폰트 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <!-- 통합 스타일시트 (3개 화면 CSS 통합본) -->
  <link rel="stylesheet" href="style.css" />
  <!-- 로그인 / 회원가입 모달 스타일 -->
  <link rel="stylesheet" href="auth_modal.css" />
</head>
<body>
  <!-- [화면 1] 상품 목록 영역 (상단 헤더 + 카테고리/토글 필터 + 6개 상품 카드 그리드) -->
  <div id="screen-list"></div>

  <!-- [화면 3] 글쓰기 화면 영역 (글쓰기 버튼 클릭 시 전환) -->
  <section id="screen-write" class="gamza-write-screen" aria-label="글쓰기 화면"></section>

  <!-- [화면 2] 상세 팝업 모달은 app.js 초기화 시 body 하단에 마운트됩니다 (#detail-modal-overlay) -->

  <!-- Supabase JS 라이브러리 및 연동 스크립트 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <!-- 로그인/회원가입 인증 모달 모듈 -->
  <script src="auth_modal.js"></script>

  <!-- 화면 모듈 및 메인 앱 컨트롤러 -->
  <script src="screen1_list.js"></script>
  <script src="screen2_detail.js"></script>
  <script src="screen3_write.js"></script>
  <script src="app.js"></script>
</body>
</html>
